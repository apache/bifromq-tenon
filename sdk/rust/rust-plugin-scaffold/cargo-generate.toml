[template]
cargo_generate_version = "=0.25.0"

[placeholders.interface]
type = "string"
prompt = "Plugin interface"
choices = ["source", "sink", "source-and-sink"]

[conditional.'interface == "source"']
ignore = ["src/output", "src/file_program", "proto/sink_record_payload.proto"]

[conditional.'interface == "sink"']
ignore = ["src/source", "proto/source_record_payload.proto"]
