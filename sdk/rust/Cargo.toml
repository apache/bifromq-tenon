[workspace]
members = ["ipc", "plugin-sdk", "process-metrics", "cargo-tenon"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/apache/incubator-bifromq-tenon"
publish = false

[workspace.dependencies]
tenon-ipc = { path = "ipc", version = "=0.1.0" }
tenon-process-metrics = { path = "process-metrics", version = "=0.1.0" }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["metrics"] }
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic-messages", "metrics"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["metrics", "experimental_metrics_custom_reader"] }
base64 = { version = "=0.23.0", default-features = false, features = ["std"] }
bytes = "=1.12.1"
cpu-time = "=1.0.0"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http2"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
libc = "=0.2.186"
loom = { version = "=0.7.2", default-features = false }
memmap2 = "=0.9.11"
jsonc-parser = { version = "=0.33.0", default-features = false }
jsonschema = { version = "=0.53.0", default-features = false, features = ["idna"] }
prost = "=0.14.4"
prost-build = "=0.14.4"
prost-reflect = "=0.16.5"
prost-types = "=0.14.4"
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
protoc-bin-vendored = "=3.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = { version = "=0.11.0", default-features = false }
tar = { version = "=0.4.46", default-features = false }
tempfile = "=3.27.0"
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-stream = { version = "=0.1.17", default-features = false, features = ["net"] }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "channel"] }
tonic-prost = "=0.14.6"
tonic-prost-build = { version = "=0.14.6", default-features = false, features = ["transport"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

[profile.dev]
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
